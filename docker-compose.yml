services:
  app:
    build:
      context: ./
      dockerfile: Dockerfile
    env_file:
      - .env
    command: yarn start:dev
    ports:
      - "${APP_PORT}:${APP_PORT}"
    volumes:
      - .:/home/node
      - node_modules:/home/node/node_modules
    depends_on:
      - db

  db:
    image: postgres:16
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - pg-data:/var/lib/postgresql/data
    user: postgres
    ports:
      - "5433:5432"
    expose:
      - "5432"
    environment:
      POSTGRES_DB: budget_db
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust

# своя подсеть: Docker по умолчанию брал 172.18.x, а её кусок 172.18.0.0/30 занимает VPN-интерфейс singbox_tun
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  node_modules:
  pg-data:
